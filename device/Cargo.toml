cargo-features = ["per-package-target"]

[package]
name = "trmrs-device"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
default-target = "riscv32imc-esp-espidf"

[[bin]]
name = "trmrs-device"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[dependencies]
trmrs_core = { path = "../trmrs_core" }
log = "0.4"
esp-idf-svc = { version = "0.52.1", features = ["embassy-time-driver", "embassy-sync"] }
embassy-executor = { version = "0.10", features = ["executor-thread", "platform-std"] }
critical-section = { version = "1.2", features = ["std"], default-features = false }
epd-waveshare = "0.6.0"
esp-idf-hal = "0.46.2"
esp-idf-sys = "0.37.2"
embedded-graphics = "0.8.1"
embedded-svc = "0.29"
anyhow = "1.0.100"
rand = "0.9.2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[build-dependencies]
embuild = "0.33"
